[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owc-fowt-hydro"
version = "0.1.0"
description = "Capytaine-BEMIO-WEC-Sim reduced-order workflow for an OWC-integrated floating offshore wind platform."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
